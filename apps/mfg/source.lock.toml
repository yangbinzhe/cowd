# Canonical, build-time source selection for the first-party MFG APP.
# It is deliberately not runtime configuration: changing this file requires a
# product rebuild and review of the generated Cargo/WebUI inputs.
schema = 1
app_id = "mfg"
sdk_api = 1

[rust]
git = "https://gitee.com/eyeout/cowd-app-mfg"
rev = "a7a876b0d420cf9cf1661f3ec48d291e0ba44da4"
packages = [
    "cowd-app-mfg-contract",
    "cowd-app-mfg-core",
    "cowd-app-mfg-adapter",
    "cowd-app-mfg-tui",
]

[webui]
git = "https://gitee.com/eyeout/cowd-app-mfg"
rev = "a7a876b0d420cf9cf1661f3ec48d291e0ba44da4"
package = "@cowd/app-mfg-webui"
