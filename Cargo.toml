[workspace]
members = [
    "crates/harness-contract",
    "crates/app-mfg",
    "crates/approval",
    "crates/cli",
    "crates/fact-kernel",
    "crates/gateway",
    "crates/harness-eval",
    "crates/matrix/core",
    "crates/matrix/repository",
    "crates/mcp",
    "crates/memory",
    "crates/model-protocol",
    "crates/plugins",
    "crates/provider",
    "crates/connector",
    "crates/runtime",
    "crates/session",
    "crates/skill/service",
    "crates/storage",
    "crates/surface",
    "crates/tools",
    "crates/tui",
]
resolver = "2"
default-members = [
    "crates/harness-contract",
    "crates/app-mfg",
    "crates/approval",
    "crates/cli",
    "crates/fact-kernel",
    "crates/gateway",
    "crates/harness-eval",
    "crates/matrix/core",
    "crates/matrix/repository",
    "crates/mcp",
    "crates/memory",
    "crates/model-protocol",
    "crates/plugins",
    "crates/provider",
    "crates/connector",
    "crates/runtime",
    "crates/session",
    "crates/skill/service",
    "crates/storage",
    "crates/surface",
    "crates/tools",
]

[workspace.package]
version = "0.9.483"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.12"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "stream", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
memory = { path = "crates/memory" }
gateway = { path = "crates/gateway" }

[profile.dev]
debug = 1

[profile.release]
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "forbid"
dead_code = "warn"
unused_imports = "warn"
unused_variables = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -2 }
unwrap_used = { level = "warn", priority = -1 }
expect_used = { level = "warn", priority = -1 }
