[workspace]
members = [
    "crates/product-apps",
    "crates/app-sdk",
    "crates/app-host",
    "crates/harness-contract",
    "crates/auth-broker",
    "crates/cli",
    "crates/fact-kernel",
    "crates/fact-sqlite",
    "crates/fact-postgres",
    "crates/gateway",
    "crates/harness-eval",
    "crates/matrix/core",
    "crates/matrix/repository",
    "crates/mcp",
    "crates/memory",
    "crates/memory-postgres",
    "crates/model-protocol",
    "crates/plugins",
    "crates/provider",
    "crates/connector",
    "crates/connector-postgres",
    "crates/runtime",
    "crates/runtime-postgres",
    "crates/sandbox-launcher",
    "crates/session",
    "crates/session-postgres",
    "crates/skill/service",
    "crates/storage",
    "crates/surface",
    "crates/surface-postgres",
    "crates/tools",
    "crates/tui",
    "crates/xtask",
]
resolver = "2"
default-members = [
    "crates/product-apps",
    "crates/app-sdk",
    "crates/app-host",
    "crates/harness-contract",
    "crates/auth-broker",
    "crates/cli",
    "crates/fact-kernel",
    "crates/fact-sqlite",
    "crates/fact-postgres",
    "crates/gateway",
    "crates/harness-eval",
    "crates/matrix/core",
    "crates/matrix/repository",
    "crates/mcp",
    "crates/memory",
    "crates/memory-postgres",
    "crates/model-protocol",
    "crates/plugins",
    "crates/provider",
    "crates/connector",
    "crates/connector-postgres",
    "crates/runtime",
    "crates/runtime-postgres",
    "crates/sandbox-launcher",
    "crates/session",
    "crates/session-postgres",
    "crates/skill/service",
    "crates/storage",
    "crates/surface",
    "crates/surface-postgres",
    "crates/tools",
    "crates/xtask",
]

[workspace.package]
version = "0.9.643"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = { version = "=1.2.1", features = ["chrono04", "uuid1"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.12"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "stream", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
memory = { path = "crates/memory" }
gateway = { path = "crates/gateway" }

[profile.dev]
debug = 1

[profile.release]
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "forbid"
dead_code = "warn"
unused_imports = "warn"
unused_variables = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -2 }
unwrap_used = { level = "warn", priority = -1 }
expect_used = { level = "warn", priority = -1 }

# External APP crates resolve Cowd foundation packages from a Git revision.
# Product composition patches them back to this workspace so the final binary
# has exactly one SDK/foundation type identity, never a Git/path duplicate.
[patch."https://gitee.com/eyeout/cowd"]
cowd-app-sdk = { path = "crates/app-sdk" }
cowd-app-host = { path = "crates/app-host" }
harness-contract = { path = "crates/harness-contract" }
matrix-core = { path = "crates/matrix/core" }
matrix-repository = { path = "crates/matrix/repository" }
storage = { path = "crates/storage" }
