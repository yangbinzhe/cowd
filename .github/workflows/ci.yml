name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  validate-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: scripts/validate.sh quick
      - run: scripts/ci/clippy-safety.sh

  validate-core:
    runs-on: ubuntu-latest
    needs: validate-fast
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/validate.sh contract

  release-gate:
    runs-on: ubuntu-latest
    needs: validate-fast
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p runtime release_gate
      - run: cargo test -p gateway cowd_release_gate_route_reports_missing_timeline_evidence

  validate-scenario:
    runs-on: ubuntu-latest
    needs: [validate-core, release-gate]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y tmux curl ripgrep iproute2 sqlite3 python3
      - run: scripts/validate.sh scenario

  build:
    runs-on: ubuntu-latest
    needs: validate-fast
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace
