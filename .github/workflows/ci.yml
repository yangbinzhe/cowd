name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  validate-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: webui
      - run: cargo check --workspace
      - run: cargo clippy --workspace --all-targets
      - run: scripts/validate_fast.sh

  validate-core:
    runs-on: ubuntu-latest
    needs: validate-fast
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: webui
      - run: scripts/validate_core.sh

  release-gate:
    runs-on: ubuntu-latest
    needs: validate-fast
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: webui
      - run: cargo test -p runtime release_gate
      - run: cargo test -p cowd-cli cowd_release_gate
      - run: npm test -- modules.test.js
        working-directory: webui

  validate-scenario:
    runs-on: ubuntu-latest
    needs: [validate-core, release-gate]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: scripts/validate_live.sh

  build:
    runs-on: ubuntu-latest
    needs: validate-fast
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace
