# Isolated deterministic configuration for V9's public-API performance gate.
# It intentionally contains no operator credentials and points only at the
# disposable local OpenAI-compatible fixture started by v9-performance-gate.
model: "cowd-v9-performance-fixture"

providers:
  performance_fixture:
    base_url: "__PERFORMANCE_PROVIDER_URL__"
    api_key: "cowd-v9-performance-fixture"
    models: ["cowd-v9-performance-fixture"]
    protocol: "completions"

fallbacks: []

gateway:
  enabled: true
  platforms:
    - platform_type: api_server
      enabled: true
      host: "127.0.0.1"
      port: 8765
      auth:
        enabled: true
        token: "cowd-v9-performance-fixture-token"

storage:
  root: "__PERFORMANCE_STORAGE_ROOT__"
