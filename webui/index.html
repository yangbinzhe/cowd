<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cowd WebUI</title>
  <link rel="icon" href="./assets/app/logo-XZ1BH8jJ.svg" type="image/svg+xml" />
  <link rel="manifest" href="./assets/app/manifest-lhefZz52.json" />
  <meta name="theme-color" content="#1b1c1a" />
  <script>
    (function(){
      var theme = localStorage.getItem('cowd-theme') || 'dark';
      var skin = localStorage.getItem('cowd-skin') || 'graphite';
      document.documentElement.dataset.theme = theme === 'system'
        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : theme;
      document.documentElement.dataset.skin = skin;
    })();
  </script>
  <script type="module" crossorigin src="./assets/app/index.dev-ZZ9KwfsG.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/app/index-BwC9LoY7.css">
</head>
<body>
  <div id="app"></div>
</body>
</html>
