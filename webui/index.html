<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cowd Web UI</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
</head>
<body>
<aside id="sidebar">
    <div id="sidebar-header">
        <button id="btn-new-session" class="btn-primary">+ New Session</button>
        <input id="session-search" type="search" placeholder="Search sessions...">
    </div>
    <ul id="session-list"></ul>
    <div id="sidebar-footer"><small>Cowd v<span id="version">0.2.0</span></small></div>
</aside>
<main id="chat">
    <div id="chat-header">
        <span id="current-model">claude-sonnet-4-6</span>
        <span id="token-usage">0 tk</span>
    </div>
    <div id="chat-messages"></div>
    <div id="loading-indicator" class="hidden"><span class="spinner">⠋</span> Thinking...</div>
    <div id="chat-input-area">
        <textarea id="chat-input" rows="3" placeholder="Enter message... (Enter=send, Shift+Enter=newline)"></textarea>
        <button id="btn-send" class="btn-primary">Send</button>
    </div>
</main>
<aside id="right-panel" class="hidden">
    <div id="panel-tabs">
        <button data-panel="files">Files</button>
        <button data-panel="memory">Memory</button>
        <button data-panel="settings">Settings</button>
        <button data-panel="close">x</button>
    </div>
    <div id="panel-content"></div>
</aside>
<div id="toast"></div>
<script src="boot.js" type="module"></script>
</body>
</html>
