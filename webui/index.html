<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cowd Web UI</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" integrity="sha384-5TcZemv2l/9On385z///+d7MSYlvIEw9FuZTIdZ14vJLqWphw7e7ZPuOiCHJcFCP" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-core.min.js" crossorigin="anonymous" defer></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js" crossorigin="anonymous" defer></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js" integrity="sha384-hWrXcNiwGjVMR8+JV5ZCRoDd/8KqKpczP+8dQ1NUXJdLzNu4XhOq6bUaqZUXJeR" crossorigin="anonymous" defer></script>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f6feb">
<meta name="mobile-web-app-capable" content="yes">
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
</script>
<script>
(function(){
  var t=(localStorage.getItem('cowd-theme')||'dark');
  if(t==='light')document.documentElement.dataset.theme='light';
  else if(t==='system'&&window.matchMedia('(prefers-color-scheme:dark)').matches){}
  else{document.documentElement.dataset.theme='dark';}
})();
</script>
</head>
<body>
<aside id="sidebar">
  <div id="sidebar-header">
    <button id="btn-new-session" class="btn-primary">+ New Session</button>
    <input id="session-search" type="search" placeholder="Search sessions...">
  </div>
  <ul id="session-list"></ul>
  <div id="sidebar-footer">
    <button id="btn-control-center" class="btn-icon" title="Control Center">&xvee;</button>
    <small>Cowd v<span id="version">0.7.4</span></small>
  </div>
</aside>

<main id="chat">
  <div id="chat-header">
  <div id="chat-header-left">
    <select id="model-selector" class="model-picker" title="Select model"></select>
    <span id="token-usage">0 tk</span>
  </div>
  <div id="chat-header-right">
    <span id="cost-display" style="font-size:12px;color:var(--text3);margin-right:12px"></span>
    <span id="connection-status" style="font-size:11px;margin-right:12px">Disconnected</span>
    <button id="btn-toggle-panel" class="btn-icon" title="Toggle Panel">&xllcor;</button>
  </div>
  </div>
  <div id="chat-messages"></div>
  <div id="streaming-msg" class="message assistant streaming hidden"></div>
  <div id="loading-indicator" class="hidden"><span class="spinner">&xodot;</span> Thinking...</div>
  <div id="chat-input-area">
    <textarea id="chat-input" rows="3" placeholder="Enter message... (Enter=send, Shift+Enter=newline)"></textarea>
    <div id="chat-input-actions">
      <button id="btn-slash" class="btn-icon btn-sm" title="Slash Commands">/</button>
      <div id="slash-dropdown" class="dropdown hidden"></div>
      <button id="btn-send" class="btn-primary">Send</button>
    </div>
  </div>
</main>

<aside id="right-panel" class="hidden">
  <div id="panel-tabs">
    <button data-panel="workspace" class="tab-active">Files</button>
    <button data-panel="memory">Memory</button>
    <button data-panel="skills">Skills</button>
    <button data-panel="crons">Crons</button>
    <button data-panel="agents">Agents</button>
    <button data-panel="tools">Tools</button>
    <button data-panel="gateway">Gateway</button>
    <button data-panel="settings">Settings</button>
    <button data-panel="close" title="Close Panel">x</button>
  </div>
  <div id="panel-content"></div>
</aside>

<div id="control-center" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-header">
      <h2>Cowd Control Center</h2>
      <button onclick="UI.closeModal('control-center')" class="btn-icon">x</button>
    </div>
    <div class="modal-tabs">
      <button data-cc="config">Config</button>
      <button data-cc="providers">Providers</button>
      <button data-cc="approval">Approval</button>
      <button data-cc="history">History</button>
      <button data-cc="usage">Usage</button>
    </div>
    <div id="cc-content"></div>
  </div>
</div>

<div id="toast"></div>

<div id="login-modal" class="modal-overlay hidden">
  <div class="modal-box" style="width:360px;max-width:90vw">
    <div class="modal-header">
      <h2>Cowd Login</h2>
    </div>
    <div style="padding:20px">
      <p style="font-size:13px;color:var(--text2);margin-bottom:12px">Enter your auth token to connect.</p>
      <input id="login-token" type="password" placeholder="Auth token" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:14px;margin-bottom:12px">
      <div id="login-error" style="font-size:12px;color:var(--error);margin-bottom:8px;display:none"></div>
      <button id="btn-login" class="btn-primary" style="width:100%">Login</button>
      <p style="font-size:11px;color:var(--text3);margin-top:12px;text-align:center">Token is stored in config.yaml under gateway → api_server → auth</p>
    </div>
  </div>
</div>

<!-- Legacy scripts (replaced by Component layer)
<script src="api.js"></script>
<script src="state.js"></script>
<script src="ui.js"></script>
<script src="sessions.js"></script>
<script src="messages.js"></script>
<script src="workspace.js"></script>
<script src="panels.js"></script>
<script src="commands.js"></script>
<script src="boot.js"></script>
-->
<!-- Component layer -->
<script src="assets/js/state.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/messages.js"></script>
<script src="assets/js/sessions.js"></script>
<script src="assets/js/commands.js"></script>
<script src="assets/js/panels.js"></script>
<script src="assets/js/workspace.js"></script>
<script src="assets/js/approval.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/cron.js"></script>
<script src="assets/js/knowledge-graph.js"></script>
<script src="assets/js/memory.js"></script>
<script src="assets/js/platform.js"></script>
<script src="assets/js/tool-viz.js"></script>
<script src="assets/js/upload.js"></script>
<script src="assets/js/boot.js"></script>
</body>
</html>
