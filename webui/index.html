<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Cowd - AI Coding Assistant">
  <title>Cowd</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="style.css">
  <!-- Prism.js 语法高亮 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css">
</head>
<body>
  <div class="app" id="app">
    <!-- 登录模态框 -->
    <div class="modal" id="loginModal">
      <div class="modal-content">
        <div class="modal-header">
          <svg class="modal-logo" viewBox="0 0 32 32" width="48" height="48">
            <defs>
              <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#e94560"/>
                <stop offset="100%" style="stop-color:#16213e"/>
              </linearGradient>
            </defs>
            <rect width="32" height="32" rx="6" fill="url(#logoBg)"/>
            <text x="16" y="22" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">C</text>
          </svg>
          <h2>登录 Cowd</h2>
        </div>
        <div class="form-group">
          <label for="loginToken">访问令牌</label>
          <input type="password" id="loginToken" placeholder="输入访问令牌..." autocomplete="current-password">
        </div>
        <div class="error-message" id="loginError"></div>
        <div class="form-actions">
          <button class="btn primary" id="loginBtn">登录</button>
        </div>
        <div class="modal-footer">
          <p>通过设置中的令牌管理生成访问令牌</p>
        </div>
      </div>
    </div>

    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="app-brand">
          <svg class="brand-logo" viewBox="0 0 32 32" width="28" height="28">
            <defs>
              <linearGradient id="brandBg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#e94560"/>
                <stop offset="100%" style="stop-color:#16213e"/>
              </linearGradient>
            </defs>
            <rect width="32" height="32" rx="6" fill="url(#brandBg)"/>
            <text x="16" y="22" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">C</text>
          </svg>
          <span class="brand-name">Cowd</span>
        </div>
        <button class="new-chat-btn" id="newChatBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          新对话
        </button>
      </div>

      <!-- 导航栏 -->
      <nav class="sidebar-nav">
        <button class="nav-tab active" data-panel="chat">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
          </span>
          <span class="nav-label" data-i18n="nav.chat">聊天</span>
        </button>
        <button class="nav-tab" data-panel="sessions">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            </svg>
          </span>
          <span class="nav-label" data-i18n="nav.sessions">会话</span>
        </button>
        <button class="nav-tab" data-panel="memory">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a7 7 0 0 1 7 7c0 2.5-1.3 4.7-3.2 6H8.2C6.3 13.7 5 11.5 5 9a7 7 0 0 1 7-7z"></path>
              <line x1="9" y1="17" x2="15" y2="17"></line>
              <line x1="10" y1="20" x2="14" y2="20"></line>
            </svg>
          </span>
          <span class="nav-label" data-i18n="nav.memory">记忆</span>
        </button>
        <button class="nav-tab" data-panel="config">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
            </svg>
          </span>
          <span class="nav-label" data-i18n="nav.config">配置</span>
        </button>
        <button class="nav-tab" data-panel="platform">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
              <line x1="12" y1="18" x2="12.01" y2="18"></line>
            </svg>
          </span>
          <span class="nav-label" data-i18n="nav.platform">平台</span>
        </button>
      </nav>

      <!-- 会话列表 -->
      <div class="session-list" id="sessionList">
        <div class="session-list-header" data-i18n="sessions.recent">最近会话</div>
        <div class="session-items" id="sessionItems"></div>
      </div>

      <!-- 底部设置 -->
      <div class="sidebar-footer">
        <button class="theme-toggle" id="themeToggle" title="切换主题">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
        <select id="langSelect" class="lang-select">
          <option value="zh-CN">中文</option>
          <option value="en">English</option>
        </select>
        <button class="logout-btn" id="logoutBtn" title="退出登录">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content">
      <!-- 聊天面板 -->
      <div class="panel active" id="panelChat">
        <div class="messages" id="messages">
          <div class="welcome-message">
            <div class="welcome-icon">
              <svg viewBox="0 0 32 32" width="64" height="64">
                <defs>
                  <linearGradient id="welcomeBg" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#e94560"/>
                    <stop offset="100%" style="stop-color:#16213e"/>
                  </linearGradient>
                </defs>
                <rect width="32" height="32" rx="6" fill="url(#welcomeBg)"/>
                <text x="16" y="22" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">C</text>
              </svg>
            </div>
            <h2>欢迎使用 Cowd</h2>
            <p>我是您的 AI 编程助手，可以帮助您完成代码编写、调试、重构等任务。</p>
            <div class="suggestions">
              <div class="suggestion" data-prompt="帮我分析当前项目的架构">
                <span class="suggestion-icon">📊</span>
                <span>分析项目架构</span>
              </div>
              <div class="suggestion" data-prompt="帮我写一个 Hello World 程序">
                <span class="suggestion-icon">👋</span>
                <span>写 Hello World</span>
              </div>
              <div class="suggestion" data-prompt="解释这段代码的逻辑">
                <span class="suggestion-icon">🔍</span>
                <span>解释代码</span>
              </div>
              <div class="suggestion" data-prompt="帮我重构这个函数">
                <span class="suggestion-icon">♻️</span>
                <span>重构代码</span>
              </div>
            </div>
          </div>
        </div>
        <div class="composer">
          <div class="composer-inner">
            <textarea
              id="inputArea"
              placeholder="输入消息，或使用 / 命令..."
              rows="1"
            ></textarea>
            <button class="send-btn" id="sendBtn" disabled>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </div>
          <div class="composer-hints">
            <span class="hint">按 <kbd>Enter</kbd> 发送，<kbd>Shift+Enter</kbd> 换行</span>
            <span class="context-indicator" id="contextIndicator"></span>
          </div>
        </div>
      </div>

      <!-- 会话面板 -->
      <div class="panel" id="panelSessions">
        <div class="panel-header">
          <h2>会话管理</h2>
          <button class="btn secondary" id="newSessionBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            新会话
          </button>
        </div>
        <div class="sessions-grid" id="sessionsGrid"></div>
      </div>

      <!-- 记忆面板 -->
      <div class="panel" id="panelMemory">
        <div class="panel-header">
          <h2>记忆系统</h2>
          <button class="btn secondary" id="refreshMemoryBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="23 4 23 10 17 10"></polyline>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
            刷新
          </button>
        </div>
        <div class="memory-stats" id="memoryStats"></div>
        <div class="memory-layers" id="memoryLayers">
          <div class="memory-layer">
            <h3>L0 - 身份层</h3>
            <div class="layer-content" id="layer0Content"></div>
          </div>
          <div class="memory-layer">
            <h3>L1 - 精华层</h3>
            <div class="layer-content" id="layer1Content"></div>
          </div>
          <div class="memory-layer">
            <h3>L2 - 项目层</h3>
            <div class="layer-content" id="layer2Content"></div>
          </div>
        </div>
      </div>

      <!-- 配置面板 -->
      <div class="panel" id="panelConfig">
        <div class="panel-header">
          <h2>系统配置</h2>
        </div>
        <div class="config-sections" id="configSections"></div>
      </div>

      <!-- 平台面板 -->
      <div class="panel" id="panelPlatform">
        <div class="panel-header">
          <h2>平台管理</h2>
        </div>
        <div class="platform-list" id="platformList"></div>
      </div>
    </main>
  </div>

  <!-- Toast 通知 -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Prism.js -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-rust.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-typescript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-yaml.min.js"></script>

  <!-- 应用脚本 -->
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/state.js"></script>
  <script src="js/sessions.js"></script>
  <script src="js/messages.js"></script>
  <script src="js/config.js"></script>
  <script src="js/memory.js"></script>
  <script src="js/platform.js"></script>
  <script src="js/panels.js"></script>
  <script src="js/commands.js"></script>
  <script src="js/workspace.js"></script>
  <script src="js/boot.js"></script>
</body>
</html>
