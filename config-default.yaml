# Cowd 默认配置文件
# 安装后自动复制到 ~/.cowd/config.yaml
# 本文件包含所有可配置项、默认值及说明
#
# 配置优先级 (高→低):
# 1. CLI 参数 (--model, --solo, --permission-mode 等)
# 2. 环境变量 (COWD_* 前缀)
# 3. 本地覆盖 (.cowd/config.local.yaml, git-ignored)
# 4. 项目配置 (.cowd/config.yaml)
# 5. 用户配置 (~/.cowd/config.yaml, 即本文件)

# =============================================================================
# 基础配置
# =============================================================================

# 默认模型必须显式配置，并且必须出现在下方某个 providers.*.models 列表中。
# model: "your-model-id"

# Gateway 默认工作区。显式配置后，Gateway 从任何目录启动都使用该目录；
# `~` 会在启动时展开为当前用户主目录。该配置不替代 sandbox.workspace_root。
# 这是启动期拓扑配置，运行中修改后需要重启 Gateway。
workspace: "~/AI"

# 模型别名只来自配置，不存在任何厂商内建别名。
# aliases:
#   main: "your-model-id"
#   fast: "your-fast-model-id"
aliases: {}

# =============================================================================
# Runtime Control Plane
# =============================================================================
# 运行时控制面用于统一任务复杂度、Agent 协作、Context 预算、记忆脉冲和权限审查。
# scenario 可选: coding | research | office | ops | personal
runtime:
  scenario: "coding"
  # 活动执行以内存为调度与读取权威，事件账本负责恢复。比例值使用
  # 字符串保留十进制精度；max_bytes 可填 2GiB/512MiB 或原始字节数。
  hot_state:
    memory:
      ratio: "0.60"
      max_bytes: null
      reserve_ratio: "0.20"
      high_watermark: "0.90"
      low_watermark: "0.75"
    shards: "auto"
    materializer_queue_capacity: 1024
    # 非边界 live 状态按时间和 revision 合并持久化；waiting/terminal
    # 状态始终立即持久化。该配置影响写放大，不影响 canonical event。
    live_checkpoint:
      min_interval_ms: 1000
      max_revision_gap: 32
  # Provider 容量由 Runtime 在一次准入中同时约束进程、账号、模型和
  # 估算 token 压力。这里是单机起始值；运行时会根据排队、吞吐和
  # 429/Retry-After 自适应收敛。显式模型项优先于内置 DeepSeek 默认。
  resources:
    provider:
      global:
        minimum: 8
        target: 64
        maximum: 256
        interactiveReserve: 8
      fallback:
        minimum: 4
        target: 32
        maximum: 128
        interactiveReserve: 8
      # null 表示遵循模型目录；也可配置为单次响应的统一上限。
      maxOutputTokensOverride: null
      accounts: {}
      models: {}
  control:
    enabled: true
    agent:
      enabled: true
      max_parallel_agents: 42
      review_on_conflict: true
      require_positive_lift: true
      min_collaboration_score: 50
    task:
      auto_phase_for_yolo: true
      review_after_each_phase: true
      max_failures_before_review: 2
    context:
      preserve_stable_head: true
      # 0 表示由 RuntimeBudgetPlan 按模型上下文窗口动态派生。
      # 只有在需要强制压低特定模式预算时才设置为固定 token 数。
      yolo_budget_tokens: 0
      collaboration_budget_tokens: 0
      review_budget_tokens: 0
      degrade_on_pressure_bp: 8500
    memory:
      emit_pulses_from_execution_graph: true
      review_conflicts: true
      max_candidates_per_turn: 8

# 模型上下文窗口覆盖 (优先级高于内置静态表)
# 格式: "模型名": token数
# 使用场景: 自定义 API endpoint 的窗口大小不同、限制本地模型上下文等。
# 显式配置会在新建或恢复 Session Runtime 时采用；运行中的 Session 不会被热重写。
# 只有 Provider 返回明确的、更小的数值上限时，当前 Runtime 才会临时校准并重试一次，
# 不会改写此配置。未配置且无法识别的模型按 128K 上下文、64K 最大输出估算。
# ~/.cowd/models.yaml 是进程级模型元数据，修改后需重启 Gateway 才会重建快照。
model_context_windows: {}
# 示例:
# model_context_windows:
#   "my-custom-model": 32000
#   "deepseek-v4-pro": 64000       # 覆盖内置 1M 默认值

# 会话热历史使用共享不可变分块与有界尾段。这里控制封块和请求编译缓存，
# 不影响持久化完整性；较大的值减少封块频率，较小的值降低分叉时尾段复制。
session_history:
  chunk_messages: 128
  chunk_bytes: 262144
  request_cache_entries: 16

# =============================================================================
# Provider 配置 (多Provider自动路由)
# =============================================================================
# cowd 根据 model 名自动匹配 Provider 的 base_url 和 api_key
# 支持 Anthropic Messages、OpenAI Chat Completions、OpenAI Responses 三类协议。
# protocol 可选；不配置时 cowd 会根据 provider 名、base_url、model 名本地探测。
# 显式配置后不再探测，合法值为: anthropic, completions, responses。

# Provider 路由默认严格按 primary/fallback 配置。auto 仅消费版本匹配、
# 新鲜且具有完整质量证据的 Outcome 投影；证据不足时整次回退 pinned。
routing_mode: pinned

providers: {}
# 示例:
# providers:
#   deepseek:
#     base_url: "https://api.deepseek.com"
#     api_key: "sk-..."
#     models: ["deepseek-v4-pro", "deepseek-v4-flash"]
#     protocol: "completions"
#     parallel_tool_calls: "auto" # auto | enabled | disabled
#     early_tool_start: "auto" # auto 仅在模型目录有成对性能验证后启用
#   openai:
#     base_url: "https://api.openai.com/v1"
#     api_key: "sk-..."
#     models: ["gpt-5"]
#     protocol: "responses"
#     parallel_tool_calls: "auto"
#     early_tool_start: "auto"
#   bailian:
#     base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
#     api_key: "sk-..."
#     models: ["qwen3-max", "qwen3-coder-next"]
#     protocol: "completions"
#     parallel_tool_calls: "auto"
#     early_tool_start: "auto"

# Provider 故障转移链
# 按顺序尝试已配置模型。生产可用性链应跨 Provider/账户配置；
# 同一 Provider 下的不同模型无法隔离凭据失效、余额不足等账户级故障。
# 热加载后从现有 Session/Agent 的下一次 Provider 请求开始生效。
fallbacks: []

# =============================================================================
# 权限与审批
# =============================================================================

permissions:
  # 默认权限模式: read-only | workspace-write | danger-full-access
  default_mode: "workspace-write"
  # 允许列表 (即使权限模式更低也允许)
  allow: []
  # 拒绝列表 (即使权限模式更高也禁止)
  deny: []
  # 每次询问
  ask: []

# Runtime 统一审批协调器
approval:
  # supervised（更保守）| balanced（默认）| autonomous（可自动批准可逆中风险）
  profile: "balanced"
  # 仅对非显式、已知低风险请求生效: auto_approve_once | pending
  low_risk_timeout: "auto_approve_once"

# =============================================================================
# Storage 统一治理
# =============================================================================
# 0.9.295 起，cowd 内核统一声明存储布局。Gateway/TUI 会通过健康检查展示
# registry、migration 和锁诊断；历史 .cowd/*.db 或 .cowd/*.sqlite 不会被静默移动。
storage:
  # auto: PostgreSQL 优先，冷启动探测不可用或无配置时自动回退 SQLite。
  # postgres: 强制 PostgreSQL（启动失败即退出）；sqlite: 强制本地模式。
  backend: "auto"
  preferred: "postgres"
  fallback: "sqlite"
  fallbackProbeTimeoutMs: 3000
  # Session 同步后端只通过有界执行平面进入异步 Runtime。
  # 默认值按机器并行度计算；仅在压测或资源隔离时显式覆盖。
  # sessionExecution:
  #   workers: 8
  #   queueCapacity: 64
  # Resource、Tool 原始输出和 Evidence 共用的 Artifact 物理层。
  # 小对象进 selected SQLite/PostgreSQL，大对象进入 blobs；以下均可按部署规模覆盖。
  artifacts:
    compactThresholdBytes: 262144       # 256 KiB
    maxObjectBytes: 536870912           # 512 MiB
    totalQuotaBytes: 21474836480         # 20 GiB
    gcHighWaterBytes: 19327352832        # 18 GiB
    gcLowWaterBytes: 17179869184         # 16 GiB
    orphanGraceMs: 86400000              # 24 h
  root: "~/.cowd/storage"
  sqlite:
    session: "session.sqlite"
    memory: "memory.sqlite"
    matrix: "matrix.sqlite"
    resource_directory: "resource-directory.sqlite"
    tasks: "tasks.sqlite"
    audit: "audit.sqlite"
  files:
    audit_log: "files/audit.jsonl"
  blobs: "blobs"
  sqlite_pragmas:
    busy_timeout_ms: 5000
    journal_mode: "WAL"
    foreign_keys: true
    synchronous: "NORMAL"
    temp_store: "MEMORY"
  # PostgreSQL 只在 backend=postgres 时启用。maxConnections 是 Cowd
  # 总预算；三个 lane 的 maxConnections 要么全部省略由系统按
  # 16:24:8 比例分配，要么全部填写且总和等于总预算。
  # postgres:
  #   logicalIdentity: "cowd-primary"
  #   # 本机长期服务推荐 file:postgres-primary，对应
  #   # ~/.cowd/secrets/postgres-primary（Unix 权限必须不宽于 0600）。
  #   # 容器或外部 secret injection 可继续使用 env:COWD_POSTGRES_URL。
  #   secretRef: "file:postgres-primary"
  #   maxConnections: 48
  #   serverReserve: 8
  #   critical:
  #     maxConnections: 16
  #     minIdleConnections: 3
  #     checkoutTimeoutMs: 250
  #   onlineRead:
  #     maxConnections: 24
  #     minIdleConnections: 4
  #     checkoutTimeoutMs: 500
  #   background:
  #     maxConnections: 8
  #     minIdleConnections: 2
  #     checkoutTimeoutMs: 2000

# 受信根路径 (超出此范围的文件操作需要额外确认)
trusted_roots: []

# =============================================================================
# 上下文预算与语义压缩
# =============================================================================
# `context_budget` 仅分配 Runtime 内部的记忆、工具结果、团队和控制预算；
# 它绝不限制单次 Provider 请求。Provider 请求始终尽量使用模型真实硬容量。
context_budget:
  subsystem_budget_ratio_bp: 7000 # 内部子系统预算比例，7000 = 70%

# 每次模型调用前，Runtime 用候选模型窗口、输出预留、协议开销、工具 schema、
# 对话历史与必需上下文进行预检。只有所有候选都无法容纳必需内容时才语义压缩。
compression:
  # 会话级语义压缩
  session:
    preserve_recent: 6              # 压缩后保留最近 N 条消息原文
    summary_max_tokens: 2000        # 语义检查点的最大摘要预算

  # 记忆深度压缩开关。会话自动压缩由 session 配置控制。
  deep:
    enabled: true

# =============================================================================
# System Prompt 缓存
# =============================================================================
# 感知配置文件和身份文件变更，自动重建缓存
# 大幅降低 API 输入成本 (Anthropic prompt caching 兼容)

prompt_cache:
  check_interval: 5                # 每 N 轮检查文件变更
  max_age: 50                      # 最大缓存轮数
  memory_delta: 3                  # 记忆增量阈值 (新增 N 条 High 记忆后重建)

# =============================================================================
# 输出风格
# =============================================================================

# output_style: "terse"  # terse(极简) | standard(标准) | 不设置(使用模型默认)

# =============================================================================
# 沙箱执行
# =============================================================================

sandbox:
  enabled: false                   # 默认不启用沙箱
  timeout_secs: 30                 # 执行超时 (秒)
  max_output_kib: 100              # 输出上限 (KB)
  max_entries: 50                  # FTS5 沙箱条目上限
  # 文件系统隔离模式 (可选)
  # filesystem_mode: "workspace-only"  # off | workspace-only | allow-list
  # allowed_dirs:                      # allow-list 模式下的允许目录
  #   - "/tmp"
  #   - "/var/cache"

# =============================================================================
# 记忆系统 (5层架构: L0-L4)
# =============================================================================

memory:
  # 全局开关
  enabled: true

  # 一致性过滤阈值 (基点, 100=0.01, 1000=0.10, 5000=0.50)
  # 低于此阈值的记忆条目将被排除
  coherence_threshold_bp: 1000

  # ── L0 身份引导 ──
  # 由系统一次性写入 L0（LLM 不允许直接写 L0）：角色定位与回复语言。
  identity:
    role: "资深工程与系统架构助手：精通全栈开发、制造运营系统、Agent 协作与数据治理"
    language: "zh-CN"

  # 自适应压缩模型 (根据模型名自动调整压缩参数)
  # model: "your-compression-model-id"

  # ── 存储配置 ──
  store:
    sqlite_path: "~/.cowd/storage/memory.sqlite" # SQLite 数据库路径
    blob_dir: "~/.cowd/storage/blobs/memory"     # Blob 存储目录
    enable_vector_index: true    # 启用向量索引

  # ── 向量索引 (可选, 使用 OpenAI-compatible embeddings API) ──
  # 向量索引启用的前提条件:
  #   1. store.enable_vector_index = true
  #   2. vector.enabled = true
  #   3. model 非空；若该模型已声明在 providers 中，Gateway 自动派生
  #      <provider.base_url>/embeddings 和凭据，无需重复配置。
  #   4. 对未声明在 providers 中的模型，需要显式配置 api_url/api_key。
  # 若无法解析远程嵌入端点，搜索能力降级为关键词检索，状态接口会明确展示原因。
  # 显式 api_url/api_key 始终优先，支持 OpenAI / Ollama / vLLM / LocalAI 等兼容接口。
  #
  # API key 优先级: 环境变量 COWD_VECTOR_API_KEY > 配置文件 api_key 值
  # API URL 优先级: 环境变量 COWD_MEMORY_VECTOR_API_URL > 配置文件 api_url 值
  # Model 优先级:  环境变量 COWD_MEMORY_VECTOR_MODEL > 配置文件 model 值
  vector:
    enabled: true
    model: ""                     # 可引用 providers 中声明的嵌入模型
    api_url: ""                   # 可选显式覆盖；环境变量: COWD_MEMORY_VECTOR_API_URL
    api_key: ""                   # 可选显式覆盖；环境变量: COWD_VECTOR_API_KEY
    dimension: 0                  # 向量维度 (0=自动检测, 首次调用时确定)
    timeout_secs: 30              # 嵌入 API 调用超时 (秒)
    batch_size: 32                # 批量嵌入请求的最大条目数

  # ── Runtime 记忆治理 ──
  # Runtime 根据当前模型窗口和任务画像动态派生记忆检索预算；
  # memory crate 内部仅保留独立运行兜底默认值，不在用户模板中暴露重复预算。
  runtime:
    use_runtime_budget: true
    semantic_checkpoint_enabled: true
    recall_checkpoint_limit: 3

  # ── 记忆提取器 ──
  extractor:
    auto_extract: true            # 自动后台提取
    poll_interval_secs: 30        # 轮询间隔 (秒)
    batch_size: 20                # 每次提取的条目数上限
    min_confidence: 0.6           # 最低置信度阈值

  # ── 自治治理 ──
  # 写入路径实时完成幂等去重、权威覆盖和歧义隔离；后台在启动后及每天
  # 本地时间指定时段执行深治理。深治理只自动应用可证明、可回滚的动作，
  # 同权冲突、全局晋升和证据不足项继续进入审批队列。
  governance:
    enabled: true
    startup_delay_secs: 30
    deep_scan_hour_local: 3
    max_candidates: 256
    stale_threshold_bp: 9800
    low_confidence_threshold_bp: 4500

  # ── 可调阈值 (替代硬编码常量) ──
  tuning:
    sandbox_min_lines: 2000
    rebuild_confidence: 0.3
    freshness_trigger_ratio: 0.8
    closet_rebuild_ticks: 10
    audit_truncate_len: 120

  # ── 偏移检测 (自动清理过期记忆) ──
  drift:
    staleness_decay_per_day: 0.02 # 每日陈旧衰减系数
    review_threshold: 0.7         # 审查阈值
    prune_threshold: 0.95         # 自动剪枝阈值
    contradiction_jaccard_threshold: 0.6  # 矛盾检测 Jaccard 相似度

  # ── 性能预算 ──
  perf:
    hook_max_ms: 500              # 钩子最大耗时 (毫秒)
    inject_max_ms: 100            # 注入最大耗时 (毫秒)
    warn_threshold_pct: 0.8       # 警告阈值 (百分比)

  # ── 分层配置 ──
  layers:
    l0_enabled: true              # L0: 身份层
    l1_max_tokens: 4000           # L1: 核心层最大 tokens
    l2_max_tokens: 6000           # L2: 项目层最大 tokens
    l3_search_limit: 5            # L3: 深度召回结果数
    l4_enabled: false             # L4: 共享层 (团队模式启用)

# =============================================================================
# 钩子系统 (Pre/Post 工具钩子)
# =============================================================================

hooks:
  # 工具调用前执行的命令列表
  pre_tool_use: []
  # 工具调用成功后执行的命令列表
  post_tool_use: []
  # 工具调用失败后执行的命令列表
  post_tool_use_failure: []
  # 示例:
  # pre_tool_use:
  #   - "echo 'Running {{tool_name}}...'"
  # post_tool_use:
  #   - "git add -A"

# =============================================================================
# 插件系统
# =============================================================================

plugins:
  # 插件启用状态 (plugin_id → enabled)
  enabled: {}
  # 外部插件目录
  external_dirs: []

# =============================================================================
# MCP 服务器 (Model Context Protocol)
# =============================================================================

mcp:
  servers: {}
  # 示例:
  # servers:
  #   filesystem:
  #     type: stdio
  #     command: "npx"
  #     args: ["-y", "@modelcontextprotocol/server-filesystem", "/path/to/allowed/files"]
  #   remote-api:
  #     type: sse
  #     url: "https://mcp.example.com/sse"
  #     headers:
  #       Authorization: "Bearer ..."

# =============================================================================
# 签名 APP Bundle 发现与托管
# =============================================================================
# Cowd 不内置或强制依赖任何 APP；空发现目录是完整且有效的启动形态。
# Gateway 仅在启动时扫描签名 Bundle。目录或策略变更后需重启 Gateway。
# 未覆盖 directories 时使用 COWD_CONFIG_HOME/apps（默认 ~/.cowd/apps）。
# 自定义发现目录必须使用绝对路径：
# directories:
#   - /opt/cowd/apps
#
# 默认不声明任何 APP 专属策略。已验签 Bundle 使用 lazy 激活；只有在
# entries.<app-id>.activation 显式配置为 resident 时才随 Gateway 启动。
# entries:
#   <app-id>:
#     enabled: true
#     required: false
#     activation: lazy
#     config_file: /etc/cowd/apps/<app-id>.json
apps:
  entries: {}

# =============================================================================
# 网关 (多平台接入)
# =============================================================================
# cowd gateway start 启动时自动读取本配置：
#   - host/port 从 api_server 配置读取
#   - webui_dir 可指定外部 WebUI 静态资源目录
#   - API 凭证、模型和渠道密钥统一由 config/secrets 管理
#   - 直接启动: cowd gateway start

gateway:
  enabled: true
  # Surface/worker attachment 在线租约。它与下方 SSE subscription TTL
  # 相互独立；重复心跳仅按此 TTL 的 1/3 合并写入持久化投影。
  presence:
    ttl_seconds: 3600
  # Skill 文档翻译可单独选择已配置的模型或模型别名；未配置时使用全局 model。
  # 缓存键包含源内容、目标语言、模型和提示策略，源内容变化后自动失效。
  translation:
    # model: "fast"
    cache_entries: 256
  # 单物理 SSE 多路实时传输治理。逻辑 source 共用一个 Surface 连接；
  # 达到上限时显式拒绝或要求定向重同步，不截断 checkpoint 或静默丢语义事件。
  live:
    max_sources: 32
    max_subscriptions_per_principal_instance: 16
    queue_capacity: 512
    checkpoint_max_bytes: 6144
    default_ttl_seconds: 3600
    max_ttl_seconds: 86400
    baseline_timeout_ms: 15000
  # 启动只读取会话恢复清单；必须续接和最近会话才按字节预算进入热 Runtime。
  # 所有限制只治理进程内热态，不截断或删除持久化会话历史。
  recovery:
    hot_bytes: 536870912
    attached_bytes: 134217728
    recent_bytes: 268435456
    recent_window_ms: 60000
    manifest_page_size: 256
    hydrate_concurrency: 8
    activation_tail_messages: 256
    activation_metadata_messages: 1024
    context_card_cache_entries: 256
    context_index_card_span: 128
    context_index_parent_span: 16
    stable_snapshot_attempts: 16
  # 会话重置策略: daily | idle | both | always | none
  # 控制平台会话（飞书/邮件）何时自动结束并开启新对话
  session_reset: "none"
  # 清理检查间隔（秒），默认 86400 = 1天
  # cleanup_interval_secs: 86400
  # 空闲会话超时（分钟），用于 idle/both 策略，默认 30
  # idle_timeout_minutes: 30
  platforms:
    # Web API Server — cowd gateway start 使用此配置
    - platform_type: api_server
      enabled: true
      host: "127.0.0.1"
      port: 8642
      auth:
        enabled: false
        token: ""

    # ── 飞书机器人（Feishu/Lark）─────────────────────────────────────────────
    # 支持 WebSocket 长连接事件推送 + 富文本消息 + 图片/文件/音视频发送
    # - platform_type: feishu
    #   enabled: false
    #
    #   # ── 基础凭证（必填）──
    #   app_id: ""                          # 飞书应用 App ID
    #   app_secret: ""                      # 飞书应用 App Secret
    #
    #   # ── 机器人身份（可选，用于自消息过滤和 @mention 检测）──
    #   bot_open_id: ""                     # 机器人 open_id（默认=app_id）
    #   bot_name: "Cowd"                    # 机器人显示名称
    #
    #   # ── 安全配置（可选，Webhook 模式使用）──
    #   verification_token: ""              # 事件验证 Token
    #   encrypt_key: ""                     # 事件加密密钥
    #
    #   # ── WebSocket 重连配置 ──
    #   reconnect_max_attempts: 30          # 最大重连次数（0=不重连）
    #   reconnect_interval_secs: 120        # 重连间隔（秒）
    #
    #   # ── 访问控制 ──
    #   require_mention: false              # 群聊中是否需要 @机器人
    #   allow_bots: "none"                  # 机器人消息策略: none | mentions | all
    #   admins: []                          # 管理员列表 (open_id/union_id)
    #   default_group_policy: "open"        # 默认群组策略: open | allowlist | blacklist | admin_only | disabled
    #   # group_rules:                      # 群组规则（按 chat_id）
    #   #   "oc_xxx":
    #   #     policy: "allowlist"
    #   #     allowlist: ["ou_user1"]
    #   #     require_mention: true
    #
    #   # ── 消息批处理 ──
    #   batch_delay_ms: 600                 # 文本批处理延迟（毫秒）
    #   batch_max_messages: 8              # 每批最大消息数
    #   batch_max_chars: 4000              # 每批最大字符数
    #   media_batch_delay_ms: 800          # 媒体批处理延迟（毫秒）
    #
    #   # ── 处理队列 ──
    #   max_queue_depth: 1000              # 每聊天最大待处理事件数
    #
    #   # ── 反应追踪 ──
    #   reactions_cache_size: 1024         # 反应 LRU 缓存大小

    # ── 微信个人机器人（iLink Bot API）─────────────────────────────────────
    # - platform_type: wechat_ilink
    #   enabled: false
    #   bot_id: ""                          # 微信 iLink 控制台的 Bot ID
    #   bot_secret: ""                      # Bot Secret
    #   base_url: "https://ilinkai.weixin.qq.com"  # iLink API 基础 URL

    # 邮箱
