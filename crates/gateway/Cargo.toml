[package]
name = "gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
autobins = false

[lib]
name = "gateway"
path = "src/main.rs"

[dependencies]
harness-contract = { path = "../harness-contract" }
cowd-product-apps = { path = "../product-apps", default-features = false, features = ["app-postgres"] }
cowd-app-host = { path = "../app-host" }
cowd-app-sdk = { path = "../app-sdk" }
auth-broker = { path = "../auth-broker" }
harness-eval = { path = "../harness-eval" }
fact-kernel = { path = "../fact-kernel" }
fact-sqlite = { path = "../fact-sqlite" }
fact-postgres = { path = "../fact-postgres" }
model-protocol = { path = "../model-protocol" }
storage = { path = "../storage", features = ["storage-postgres"] }
surface = { path = "../surface" }
surface-postgres = { path = "../surface-postgres" }
approval = { path = "../approval" }
axum = { version = "0.7", features = ["multipart"] }
base64 = "0.22"
hmac = "0.12"
bytes = "1"
memory = { path = "../memory" }
memory-postgres = { path = "../memory-postgres" }
chrono = { version = "0.4", features = ["serde"] }
connector = { path = "../connector" }
connector-postgres = { path = "../connector-postgres" }
skill = { path = "../skill/service" }
futures = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http2"] }
hyper-util = { version = "0.1", features = ["client", "http2", "tokio"] }
libc = "0.2"
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
reqwest.workspace = true
runtime = { path = "../runtime" }
runtime-postgres = { path = "../runtime-postgres" }
sandbox-launcher = { path = "../sandbox-launcher" }
plugins = { path = "../plugins" }
provider = { path = "../provider" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
serde_yaml.workspace = true
schemars.workspace = true
session = { path = "../session" }
session-postgres = { path = "../session-postgres" }
mcp = { path = "../mcp" }
matrix-core = { path = "../matrix/core" }
matrix-repository = { path = "../matrix/repository" }
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "signal", "time", "io-std", "io-util", "macros", "sync", "net", "process"] }
tokio-stream = "0.1"
tools = { path = "../tools" }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"

[features]
default = ["app-mfg"]
app-mfg = ["cowd-product-apps/app-mfg"]
code-index = ["memory/code-index"]
# Explicit opt-in harness for black-box Gateway integration tests. It is never
# enabled by the production default feature set.
test-support = ["runtime/test-fixtures", "auth-broker/test-support"]

# These routes are verified through a public, feature-gated black-box harness.
# Keeping the targets opt-in ensures a normal production test build never
# compiles test-only exports, while the dedicated gate always enables them.
[[test]]
name = "agent_definition_api"
required-features = ["test-support"]

[[test]]
name = "agent_definition_routes"
required-features = ["test-support"]

[[test]]
name = "auth_mutation_gate"
required-features = ["test-support"]

[[test]]
name = "evolution_review_routes"
required-features = ["test-support"]

[[test]]
name = "promotion_review_api"
required-features = ["test-support"]

[[test]]
name = "surface_trigger_event_routes"
required-features = ["test-support"]

[[test]]
name = "team_template_routes"
required-features = ["test-support"]

[lints.rust]
unsafe_code = "allow"

[dev-dependencies]
app-mfg = { package = "cowd-app-mfg-core", git = "https://gitee.com/eyeout/cowd-app-mfg", rev = "d428e32fb837edbaf5733aa37768f84b63fda9e7" }
auth-broker = { path = "../auth-broker", features = ["test-support"] }
runtime = { path = "../runtime", features = ["test-fixtures"] }
serde_json.workspace = true
serial_test = "3"
surface-postgres = { path = "../surface-postgres" }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
