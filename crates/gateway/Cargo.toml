[package]
name = "gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
autobins = false

[lib]
name = "gateway"
path = "src/main.rs"

[dependencies]
harness-contract = { path = "../harness-contract" }
harness-eval = { path = "../harness-eval" }
fact-kernel = { path = "../fact-kernel" }
model-protocol = { path = "../model-protocol" }
storage = { path = "../storage" }
surface = { path = "../surface" }
approval = { path = "../approval" }
axum = { version = "0.7", features = ["multipart"] }
memory = { path = "../memory" }
chrono = { version = "0.4", features = ["serde"] }
connector = { path = "../connector" }
skill = { path = "../skill/service" }
app-mfg = { path = "../app-mfg" }
futures = "0.3"
libc = "0.2"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest.workspace = true
runtime = { path = "../runtime" }
plugins = { path = "../plugins" }
provider = { path = "../provider" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
serde_yaml.workspace = true
session = { path = "../session" }
mcp = { path = "../mcp" }
matrix-core = { path = "../matrix/core" }
matrix-repository = { path = "../matrix/repository" }
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "signal", "time", "io-std", "io-util", "macros", "sync", "net", "process"] }
tokio-stream = "0.1"
tools = { path = "../tools" }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4"] }

[features]
default = []
code-index = ["memory/code-index"]

[lints.rust]
unsafe_code = "allow"

[dev-dependencies]
async-trait = "0.1"
serde_json.workspace = true
serial_test = "3"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
