[package]
name = "cowd-app-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
cowd-app-protocol = { path = "../app-protocol" }
managed-worker-runtime = { path = "../managed-worker-runtime" }
serde.workspace = true
serde_json.workspace = true
ring = "0.17"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
managed-worker-runtime = { path = "../managed-worker-runtime", features = ["test-support"] }
tempfile = "3"

[features]
default = []
test-support = []

[lints]
workspace = true
