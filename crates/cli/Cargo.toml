[package]
name = "cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
auth-broker = { path = "../auth-broker" }
gateway = { path = "../gateway" }
sandbox-launcher = { path = "../sandbox-launcher" }
serde.workspace = true
tui = { path = "../tui", optional = true }

[[bin]]
name = "cowd"
path = "src/main.rs"

[features]
default = []
tui-surface = ["dep:tui"]
full = ["tui-surface", "tui/code-highlight", "gateway/code-index"]

[dev-dependencies]
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
