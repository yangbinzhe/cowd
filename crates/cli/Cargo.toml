[package]
name = "cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
auth-broker = { path = "../auth-broker" }
gateway = { path = "../gateway", default-features = false }
sandbox-launcher = { path = "../sandbox-launcher" }
runtime = { path = "../runtime" }
serde.workspace = true
serde_json.workspace = true
tui = { path = "../tui", optional = true }

[[bin]]
name = "cowd"
path = "src/main.rs"

[features]
default = ["app-mfg"]
app-mfg = ["gateway/app-mfg", "tui?/app-mfg"]
tui-surface = ["dep:tui"]
full = ["tui-surface", "app-mfg", "tui/code-highlight", "gateway/code-index"]

[dev-dependencies]
cowd-app-sdk = { path = "../app-sdk" }
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
