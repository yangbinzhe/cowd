[package]
name = "memory"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled", "modern-full"] }
thiserror = "2"
tracing = "0.1"
async-trait = "0.1"
fact-kernel = { path = "../fact-kernel" }
harness-contract = { path = "../harness-contract" }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
parking_lot = "0.12"
r2d2 = "0.8"
r2d2_sqlite = "0.24"
storage = { path = "../storage" }
walkdir = "2"
regex = "1"
tree-sitter = { version = "0.24", optional = true }
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
lz4_flex = "0.11"
notify = { version = "6", features = ["macos_kqueue"], optional = true }

[features]
default = ["store", "search", "documents"]
store = []
search = []
documents = []
code-index = [
    "dep:tree-sitter",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-python",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-go",
    "dep:tree-sitter-java",
]
watch = ["code-index", "dep:notify"]

[dev-dependencies]
serial_test = "3"
tempfile = "3"

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -2 }
module_name_repetitions = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
