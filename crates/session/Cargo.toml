[package]
name = "session"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
harness-contract = { path = "../harness-contract" }
lz4_flex = "0.11"
r2d2 = "0.8"
r2d2_sqlite = "0.24"
rusqlite = { version = "0.31", features = ["bundled", "modern-full"] }
sqlite-pool-tracker = { path = "../sqlite-pool-tracker" }
storage = { path = "../storage" }
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "rt-multi-thread"] }
tracing.workspace = true
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "allow"
dead_code = "warn"
unused_imports = "warn"
unused_variables = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -2 }
unwrap_used = { level = "warn", priority = -1 }
expect_used = { level = "warn", priority = -1 }
