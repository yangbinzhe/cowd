[package]
name = "ai-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ai-agent-spec = { path = "../ai-agent-spec" }
ai-context = { path = "../ai-context" }
ai-strategy = { path = "../ai-strategy" }
ai-tool-transaction = { path = "../ai-tool-transaction" }
ai-verification = { path = "../ai-verification" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
uuid = { version = "1", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"
dead_code = "warn"
unused_imports = "warn"
unused_variables = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -2 }
unwrap_used = { level = "warn", priority = -1 }
expect_used = { level = "warn", priority = -1 }
