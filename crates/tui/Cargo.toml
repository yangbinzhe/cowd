[package]
name = "tui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
app-mfg-contract = { package = "cowd-app-mfg-contract", git = "https://gitee.com/eyeout/cowd-app-mfg", rev = "85671604ad69e54d312cbdcf3d08fd7063b22cc9" }
harness-contract = { path = "../harness-contract" }
chrono = { version = "0.4", features = ["serde"] }
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
libc = "0.2.186"
pulldown-cmark = "0.13"
ratatui = "0.29"
reqwest = { workspace = true, features = ["multipart"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2 = "0.10"
syntect = { version = "5", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
toml = "0.8"
tui-textarea = "0.7"
unicode-segmentation = "1.13"
unicode-width = "0.2"
uuid = { workspace = true }

[features]
default = []
code-highlight = ["dep:syntect"]

[dev-dependencies]
serial_test = "3"
uuid = { workspace = true }

[lints.rust]
unsafe_code = "allow"
