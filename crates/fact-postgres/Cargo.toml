[package]
name = "fact-postgres"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
fact-kernel = { path = "../fact-kernel" }
harness-contract = { path = "../harness-contract" }
postgres = { version = "0.19", features = ["with-serde_json-1", "with-chrono-0_4"] }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
storage = { path = "../storage", features = ["storage-postgres"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
fact-sqlite = { path = "../fact-sqlite" }
tempfile = "3"

[lints]
workspace = true
