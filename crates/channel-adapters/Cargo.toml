[package]
name = "channel-adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "channel_adapters"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

# Platform adapter dependencies.
native-tls = "0.2"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "tokio1-rustls-tls"] }
imap = "3.0.0-alpha.15"
imap-proto = "0.16"
mail-parser = "0.9"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
sha1 = "0.10"
rand = "0.8"
regex = "1"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
prost = "0.13"
lru = "0.12"

[dev-dependencies]
httpmock = "0.7"
tempfile = "3"

[lints.rust]
unsafe_code = "allow"
dead_code = "warn"
unused_imports = "warn"
unused_variables = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -2 }
unwrap_used = { level = "warn", priority = -1 }
expect_used = { level = "warn", priority = -1 }
