[package]
name = "runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ai-kernel = { path = "../ai-kernel" }
ai-eval = { path = "../ai-eval" }
connector = { path = "../connector" }
model-protocol = { path = "../model-protocol" }
memory = { path = "../memory" }
storage = { path = "../storage" }
approval = { path = "../approval" }
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt", "rt-multi-thread", "time", "sync"] }
tracing = "0.1"
glob = "0.3"
plugins = { path = "../plugins" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
serde_yaml.workspace = true
telemetry = { path = "../telemetry" }
fs2 = "0.4"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
futures = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
libc = "0.2.186"

[dev-dependencies]
httpmock = "0.7"
matrix-core = { path = "../matrix/core" }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[lints.rust]
unsafe_code = "allow"
dead_code = "warn"
unused_imports = "warn"
unused_variables = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -2 }
unwrap_used = { level = "warn", priority = -1 }
expect_used = { level = "warn", priority = -1 }
