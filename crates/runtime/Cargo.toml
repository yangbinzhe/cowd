[package]
name = "runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
config = { path = "../config" }
memory = { package = "cowd-memory", path = "../memory" }
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt", "rt-multi-thread", "time"] }
tracing = "0.1"
glob = "0.3"
plugins = { path = "../plugins" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
serde_yaml.workspace = true
telemetry = { path = "../telemetry" }
walkdir = "2"
# Email support
uuid = { version = "1", features = ["v4"] }
native-tls = "0.2"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "tokio1-rustls-tls"] }
imap = "2"
mail-parser = "0.9"
# WeCom crypto support
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
sha1 = "0.10"
rand = "0.8"
futures = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
prost = "0.13"

[dev-dependencies]
httpmock = "0.7"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[lints]
workspace = true
