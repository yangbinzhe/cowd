[package]
name = "runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
memory = { package = "cowd-memory", path = "../memory" }
cowd-storage = { package = "storage", path = "../storage" }
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt", "rt-multi-thread", "time", "sync"] }
tracing = "0.1"
glob = "0.3"
plugins = { path = "../plugins" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
serde_yaml.workspace = true
telemetry = { path = "../telemetry" }
fs2 = "0.4"
walkdir = "2"
# Email support
uuid = { version = "1", features = ["v4"] }
native-tls = "0.2"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "tokio1-rustls-tls"] }
imap = "3.0.0-alpha.15"
imap-proto = "0.16"
mail-parser = "0.9"
# WeCom crypto support
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
sha1 = "0.10"
rand = "0.8"
futures = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
prost = "0.13"
lru = "0.12"
libc = "0.2.186"

[dev-dependencies]
httpmock = "0.7"
r2d2 = "0.8"
r2d2_sqlite = "0.24"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[lints.rust]
unsafe_code = "allow"
dead_code = "warn"
unused_imports = "warn"
unused_variables = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -2 }
unwrap_used = { level = "warn", priority = -1 }
expect_used = { level = "warn", priority = -1 }
