version: 2
release_version: 0.9.714
release_authority: docs/architecture/provider-prompt-cache-hardening-v0.9.714.md
release_evidence: docs/evidence/provider-prompt-cache-hardening-v0.9.714.md
source_of_truth:
  execution: scripts/validate.sh
  inventory: scripts/test/inventory.sh
  governance_gate: scripts/test/governance-gate.sh

lanes:
  quick:
    default: true
    purpose: low-cost edit feedback
  changed-crates:
    default: true
    purpose: metadata-derived package-local regression
  contract:
    default: true
    purpose: stable contracts and dependency boundaries
  serial-global:
    default: true
    purpose: isolated process-global Gateway state
  scenario:
    default: true
    purpose: cross-module golden paths
  surface:
    default: true
    purpose: CLI, TUI, and WebUI control points
  release:
    default: false
    purpose: installed artifact and product smoke
  full-regression:
    default: false
    purpose: complete parallel Rust regression plus serial-global
  manual:
    default: false
    purpose: live provider, PostgreSQL, terminal, visual, and exploratory evidence
  certification:
    default: false
    purpose: fail-closed terminal certification over independently observed evidence

architecture_gates:
  - path: cargo xtask architecture audit --check
    protects:
      - Capability inventory remains complete and unique
      - Oversized hand-written source is phase-owned and generated source has provenance
      - Version-touched Rust code cannot hide mega functions, state carriers, or constructors
      - Duplicate authorities and semantic candidates are classified before release
  - path: tests/architecture/capability-authority-gate.sh
    protects:
      - Every state authority ID resolves to one global owner
      - External ports cannot claim Runtime authority
      - Worker, Projector, and Adapter roles cannot write canonical state
  - path: scripts/architecture/check-boundaries.sh
    protects:
      - Gateway has no second AI execution loop
      - Runtime, Tools, Provider, Surface, and Connector dependency direction
      - Gateway has no direct product APP implementation ownership
      - TUI is independent from Runtime implementation crates
      - removed channel document operations do not return
      - Runtime does not depend on transport or Surface crates
      - Memory consumes fact and storage contracts
      - Memory does not reverse depend on Runtime, transport, Provider, Tools, or Matrix
  - path: crates/runtime/tests/runtime_module_architecture.rs
    protects:
      - Runtime lifecycle domains have explicit owners
  - path: crates/harness-eval/tests/architecture_dependencies.rs
    protects:
      - Harness Eval dependency direction and external Edge boundary

ignored_tests:
  gateway_serial_global:
    marker: scripts/test/gateway-global-env.sh
    runner: scripts/validate.sh serial-global
  provider_live:
    marker: COWD_AI_HARNESS_LIVE=1
    runner: scripts/validate.sh manual live-provider
  postgres_contract:
    marker: COWD_TEST_POSTGRES_URL
    runner: scripts/validate.sh manual postgres-contract
    domains:
      - fact
      - surface
      - gateway
      - memory
      - matrix
      - runtime
      - session
      - approval
      - connector
      - app-private-storage
  memory_performance:
    marker: scripts/test/memory-performance.sh
    runner: scripts/validate.sh manual memory-performance
  runtime_projection_performance:
    marker: scripts/test/runtime-projection-performance.sh
    runner: scripts/validate.sh manual runtime-projection-performance
  runtime_execution_performance:
    marker: scripts/test/runtime-execution-performance.sh
    runner: scripts/validate.sh manual runtime-execution-performance
  architecture_performance:
    marker: tests/performance-v0.9.711/run.sh
    runner: tests/performance-v0.9.711/run.sh candidate
  reference_app:
    marker: scripts/test/reference-app.sh
    runner: scripts/test/reference-app.sh
  reference_app_performance:
    marker: scripts/test/reference-app-performance.sh
    runner: scripts/test/reference-app-performance.sh
  lark_live:
    marker: scripts/test/lark-live.sh
    runner: scripts/validate.sh manual lark-live
  public_search_live:
    marker: scripts/test/public-search-live.sh
    runner: scripts/validate.sh manual public-search-live

scenario_gates:
  - script: scripts/scenarios/runtime-surface.sh
    capability: session.runtime
  - script: scripts/scenarios/memory-runtime.sh
    capability: memory.context
  - script: scripts/scenarios/channel-permission.sh
    capability: tool.permission.audit
  - script: scripts/scenarios/skill-surface-unification.sh
    capability: skill.local
  - script: scripts/ci/ai-harness.sh
    capability: harness.offline

surface_gates:
  - script: scripts/scenarios/gateway-webui-contract.sh
    capability: gateway.webui.baseline
  - script: scripts/test/reference-app.sh
    capability: app.bundle.invoke_stream_tui

manual_suites:
  - path: tests/performance-v0.9.711/run.sh
    capability: architecture.performance_comparison
  - path: crates/harness-eval/templates/certification-manifest-v1.json
    capability: harness.terminal-certification
  - path: tests/interactive
    capability: tui.gateway.manual_diagnostics
  - path: scripts/scenarios/tui-production-acceptance.sh
    capability: tui.production
  - path: scripts/ci/ai-harness-live-provider.sh
    capability: provider.live
  - path: scripts/test/postgres-contract.sh
    capability: persistence.postgres
  - path: scripts/test/memory-performance.sh
    capability: memory.performance
  - path: scripts/test/runtime-projection-performance.sh
    capability: runtime.projection.performance
  - path: scripts/test/runtime-execution-performance.sh
    capability: runtime.execution.parallel_saturation
  - path: scripts/test/lark-live.sh
    capability: lark.skill_and_cli.live
  - path: scripts/test/public-search-live.sh
    capability: tool.search.public_no_key
  - path: scripts/manual/webui-live-workbench.sh
    capability: webui.live

admission_rules:
  - Default checks protect a unique contract, boundary, or high-cost regression.
  - Source scans may enforce forbidden dependencies or execution paths, never private symbol presence.
  - Fixed test counts and historical version identifiers are not acceptance criteria.
  - Manual and live checks cannot silently pass when their required environment is present but broken.
  - Tests that require an external service are explicit ignored contracts and cannot self-skip as success.
  - New coverage must replace overlap instead of extending duplicated end-to-end paths.
