    status: planned-v2
    target: cargo test -p runtime structured_data --no-default-features
  scenario:
    status: planned-v2
    target: skill_mfg verifies structured evidence/ref propagation
  release:
    status: planned-v3
    target: release smoke checks structured data contract exposure only
  domain_fixture:
    status: current
    target: tests/fixtures/mfg/server_gpu_shortage.json
    boundary: fixture supports one golden path and must not add a sixth default scenario

