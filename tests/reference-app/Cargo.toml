[workspace]
members = ["."]

[package]
name = "cowd-reference-app"
version = "1.0.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
base64 = "0.22"
cowd-app-protocol = { path = "vendor/cowd-app-protocol-1.0.0", version = "=1.0.0" }
ed25519-dalek = "2"
http-body-util = "0.1"
hyper = { version = "1", features = ["http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "process"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
